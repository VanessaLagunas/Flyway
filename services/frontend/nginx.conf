server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse proxy hacia el API Gateway (BFF) en Kubernetes (GKE) y Docker Compose
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $bff_upstream "${BFF_UPSTREAM}";
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 10m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        proxy_buffering off;

        error_page 502 503 504 =502 @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"success":false,"error":"Error de comunicación entre el proxy frontend y bff-service (HTTP 502)."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
