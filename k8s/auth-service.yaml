apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: auth-service
          image: ghcr.io/owner/flyway-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4003
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: PORT_AUTH
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_ID_SECRET
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: VITE_GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: VITE_GOOGLE_CLIENT_ID
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 4003
      targetPort: 4003
      name: http
  selector:
    app: auth-service
