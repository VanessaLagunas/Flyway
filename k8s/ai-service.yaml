apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-service
          image: ghcr.io/owner/flyway-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: PORT_AI
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: NODE_ENV
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: OPENAI_MODEL
            - name: OPENROUTER_MODEL
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: OPENROUTER_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
      name: http
  selector:
    app: ai-service
