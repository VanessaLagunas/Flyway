apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-config
data:
  NODE_ENV: "production"
  PORT_BFF: "4000"
  PORT_AUTH: "4003"
  PORT_AI: "4001"
  PORT_CATALOG: "4002"
  # Enlaces internos DNS de Kubernetes (ClusterIP Services)
  AUTH_SERVICE_URL: "http://auth-service:4003"
  AI_SERVICE_URL: "http://ai-service:4001"
  CATALOG_SERVICE_URL: "http://catalog-service:4002"
  DATABASE_URL: "postgres://flyway:flyway_pass@postgres-db:5432/flyway_db"
  POSTGRES_DB: "flyway_db"
  POSTGRES_USER: "flyway"
  OPENAI_MODEL: "gpt-6-luna"
  OPENAI_TIMEOUT_MS: "180000"
  AI_SERVICE_TIMEOUT_MS: "210000"
  GEMINI_MODEL: "gemini-3.8-flash"
  OPENROUTER_MODEL: "openrouter/free"
  ACTIVE_AI_MODELS: "openai,openrouter"
  ENABLE_OFFLINE_MODE: "false"
  # Google OAuth 2.0 Web Client ID (ej: "1234567890-abcdefg.apps.googleusercontent.com")
  # Obtener en Google Cloud Console > APIs & Services > Credentials > OAuth 2.0 Client IDs (Web application)
  # e incluir el dominio/IP del Ingress/LoadBalancer de GKE en "Authorized JavaScript origins".
  GOOGLE_CLIENT_ID: ""
  VITE_GOOGLE_CLIENT_ID: ""
