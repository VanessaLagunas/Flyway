apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: catalog-service
          image: ghcr.io/owner/flyway-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: PORT_CATALOG
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: flyway-config
                  key: DATABASE_URL
            - name: PEXELS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flyway-secrets
                  key: PEXELS_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: ClusterIP
  ports:
    - port: 4002
      targetPort: 4002
      name: http
  selector:
    app: catalog-service
