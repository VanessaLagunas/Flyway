apiVersion: v1
kind: Secret
metadata:
  name: flyway-secrets
type: Opaque
stringData:
  # Rellena estos valores con tus credenciales reales antes de desplegar
  POSTGRES_PASSWORD: "flyway_pass"
  JWT_SECRET: "flyway-super-secret-jwt-key-2026"
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GEMINI_API_KEY: ""
  PEXELS_API_KEY: ""
  # Opcional: para Google Sign-In / OAuth 2.0 real, define GOOGLE_CLIENT_ID y VITE_GOOGLE_CLIENT_ID
  # (ej: "1234567890-abcdefg.apps.googleusercontent.com") en k8s/configmap.yaml o como Variable/Secret GOOGLE_CLIENT_ID en GitHub Actions.
  GOOGLE_CLIENT_ID: ""
  VITE_GOOGLE_CLIENT_ID: ""
